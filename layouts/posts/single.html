{{ define "head" }}
    <style>
      .back-link {
        display: inline-block;
        margin-bottom: 2em;
        color: #666;
        font-size: 0.9em;
        transition: color 0.3s ease;
      }

      .back-link:hover {
        color: #e73c7e;
      }

      .post-header {
        text-align: center;
        margin-bottom: 2em;
        padding-bottom: 1.5em;
        border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      }

      .post-header h1 {
        font-family: Roboto, sans-serif;
        font-weight: 700;
        font-size: 2em;
        color: #333;
        line-height: 1.3;
        margin-bottom: 0.5em;
      }

      .post-meta {
        font-size: 0.85em;
        color: #999;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .post-meta span {
        margin: 0 0.5em;
      }

      .post-content {
        line-height: 1.8;
        color: #333;
        font-size: 1.05em;
      }

      .post-content h2 {
        font-family: Roboto, sans-serif;
        font-size: 1.5em;
        font-weight: 700;
        margin-top: 2em;
        margin-bottom: 0.5em;
        color: #222;
      }

      .post-content h3 {
        font-family: Roboto, sans-serif;
        font-size: 1.25em;
        font-weight: 700;
        margin-top: 1.5em;
        margin-bottom: 0.5em;
        color: #333;
      }

      .post-content p {
        margin-bottom: 1.2em;
      }

      .post-content a {
        color: #e73c7e;
        text-decoration: underline;
        text-decoration-color: rgba(231, 60, 126, 0.3);
        transition: text-decoration-color 0.3s ease;
      }

      .post-content a:hover {
        text-decoration-color: #e73c7e;
      }

      .post-content blockquote {
        border-left: 3px solid #e73c7e;
        margin: 1.5em 0;
        padding: 0.5em 1.5em;
        color: #555;
        background: rgba(0, 0, 0, 0.02);
        border-radius: 0 8px 8px 0;
      }

      .post-content ul, .post-content ol {
        margin: 1em 0;
        padding-left: 2em;
      }

      .post-content li {
        margin-bottom: 0.5em;
      }

      .post-content code {
        background: rgba(0, 0, 0, 0.06);
        padding: 0.15em 0.4em;
        border-radius: 4px;
        font-size: 0.9em;
      }

      .post-content pre {
        background: #1e1e2e;
        color: #cdd6f4;
        padding: 1.2em;
        border-radius: 10px;
        overflow-x: auto;
        margin: 1.5em 0;
        font-size: 0.9em;
        line-height: 1.6;
      }

      .post-content pre code {
        background: none;
        padding: 0;
        border-radius: 0;
        font-size: inherit;
        color: inherit;
      }

      .post-content img {
        max-width: 100%;
        height: auto;
        border-radius: 10px;
        margin: 1.5em 0;
      }

      .post-content hr {
        border: none;
        border-top: 1px solid rgba(0, 0, 0, 0.08);
        margin: 2em 0;
      }

      @media (max-width: 768px) {
        .post-header h1 {
          font-size: 1.5em;
        }

        .post-content {
          font-size: 1em;
        }
      }
    </style>
{{ end }}

{{ define "main" }}
      <a href="/posts/" class="back-link"><i class="fas fa-arrow-left"></i> Back to blog</a>

      <article>
        <div class="post-header">
          <h1>{{ .Title }}</h1>
          <div class="post-meta">
            <span>{{ .Date.Format "January 2, 2006" }}</span>
            <span>&middot;</span>
            <span>{{ .ReadingTime }} min read</span>
          </div>
        </div>

        <div class="post-content">
          {{ .Content }}
        </div>
      </article>
{{ end }}
