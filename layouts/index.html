    <style>
      /* Typewriter effect */
      .typewriter {
        overflow: hidden;
        white-space: nowrap;
        margin: 0 auto;
        animation: typing 3.5s steps(40, end), blink-caret .75s step-end infinite;
      }

      @keyframes typing {
        from { width: 0 }
        to { width: 100% }
      }

      @keyframes blink-caret {
        from, to { border-color: transparent }
        50% { border-color: #333; }
      }

      /* Enhanced hover effects for social links */
      .contacts a {
        transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        display: inline-block;
        color: #333;
        opacity: 0.9;
      }

      .contacts a i {
        color: #333;
      }

      .contacts a:hover {
        transform: translateY(-5px) scale(1.2);
        color: #e73c7e;
        opacity: 1;
      }

      .contacts a:hover i {
        animation: shake 0.5s;
        color: #e73c7e;
      }

      @keyframes shake {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-10deg); }
        75% { transform: rotate(10deg); }
      }

      /* Stats section */
      .stats-section {
        margin: 2em 0;
        padding: 2em 0;
        border-top: 1px solid rgba(0,0,0,0.1);
        border-bottom: 1px solid rgba(0,0,0,0.1);
        text-align: center;
      }

      .stats-container {
        display: flex;
        justify-content: space-around;
        flex-wrap: wrap;
        margin-top: 1em;
      }

      .stat-item {
        flex: 1;
        min-width: 120px;
        padding: 1em;
        animation: fadeInUp 1s ease-out;
      }

      .stat-number {
        font-size: 2.5em;
        font-weight: bold;
        color: #e73c7e;
        display: block;
        animation: countUp 2s ease-out;
      }

      .stat-label {
        font-size: 0.9em;
        color: #666;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-top: 0.5em;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes countUp {
        from {
          opacity: 0;
          transform: scale(0.5);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* Tagline styling */
      .tagline {
        font-size: 1.1em;
        color: #444;
        margin-top: 1em;
        font-weight: 500;
        min-height: 1.5em;
        transition: opacity 0.6s ease-in-out;
      }

      .tagline.visible {
        opacity: 1;
      }

      .tagline.hidden {
        opacity: 0;
      }

      .profile .name {
        font-weight: 200;
        margin-top: 0.8em;
      }

      /* Profile section enhancements */
      .profile__portrait img {
        transition: transform 0.3s ease;
      }

      .profile__portrait:hover img {
        transform: scale(1.05) rotate(2deg);
      }

      /* Mobile optimizations */
      @media (max-width: 768px) {
        .stats-container {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 1em;
        }

        .stat-item {
          margin-bottom: 0;
        }
      }

      /* Physics ball canvas */
      .wrap {
        position: relative;
      }

      #physics-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
        border-radius: 20px;
      }
    </style>

{{ define "scripts" }}
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const titleElement = document.querySelector('.profile__title');
        if (titleElement) {
          titleElement.classList.add('typewriter');
        }

        const quotes = [
          'Scaled platform from hundreds to millions of users',
          'Led teams across 60+ global team members',
          'Deployed solutions for Ooredoo, Globe, Etisalat UAE',
          'Built cloud-native Kubernetes architectures',
          'Shipped games for Zynga, A&E, National Geographic',
          'Designed microservice platforms with GraphQL APIs',
          'Implemented regulated sportsbook platforms',
          'Developed Unity games for iOS, Android, Web',
          'Created React PWAs with real-time features',
          'Architected distributed systems with Scala/Play',
          'End-to-end business concepts to deployment',
          'Runs an army of robots 🤖',
          'VP Development at high-growth gaming platform',
          'Integrated neural networks for voice recognition',
          'Built real-money sports wagering platforms',
          'Delivered Williams Interactive gaming solutions',
          'Pioneered mobile sportsbook evolution',
          'Led R&D for Nintendo Wii & Microsoft Kinect projects',
          'Managed agile transformation initiatives',
          'Evaluated M&A technical compatibility for VC partners',
          'Optimized container-based Kubernetes deployments',
          'Delivered Kaplan K12 educational games',
          'Implemented phoneme-based voice recognition',
          'Designed pluggable game feature systems',
          'Awarded dozens of RFPs w/ technical writing',
          'Cutting edge AI-development practices',
          'VFX & video production 🎬',
          'Play piano and guitar (and might sing)',
          'What do you need?',
          'Continuous & lifelong learning on all things'
        ];

        function shuffleArray(array) {
          const arr = [...array];
          for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
          }
          return arr;
        }

        let availableQuotes = shuffleArray(quotes);
        let currentQuote = '';
        const quoteElement = document.getElementById('rotating-quote');

        function getNextQuote() {
          if (availableQuotes.length === 0) {
            availableQuotes = shuffleArray(quotes);
            if (availableQuotes[0] === currentQuote && availableQuotes.length > 1) {
              availableQuotes.push(availableQuotes.shift());
            }
          }
          currentQuote = availableQuotes.shift();
          return currentQuote;
        }

        quoteElement.textContent = getNextQuote();
        quoteElement.classList.add('visible');

        function rotateQuote() {
          quoteElement.classList.remove('visible');
          quoteElement.classList.add('hidden');

          setTimeout(() => {
            quoteElement.textContent = getNextQuote();
            void quoteElement.offsetWidth;
            quoteElement.classList.remove('hidden');
            quoteElement.classList.add('visible');
          }, 600);
        }

        setInterval(rotateQuote, 5000);

        const animateValue = (element, start, end, duration) => {
          let startTimestamp = null;
          const originalText = element.textContent;
          const hasPlus = originalText.includes('+');
          const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            const currentValue = Math.floor(progress * (end - start) + start);
            if (originalText.includes('M+')) {
              element.textContent = currentValue + 'M+';
            } else if (hasPlus) {
              element.textContent = currentValue + '+';
            } else {
              element.textContent = currentValue;
            }
            if (progress < 1) {
              window.requestAnimationFrame(step);
            }
          };
          window.requestAnimationFrame(step);
        };

        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const statNumbers = document.querySelectorAll('.stat-number');
              statNumbers.forEach((stat, index) => {
                const text = stat.textContent;
                if (text.includes('M+')) {
                  animateValue(stat, 0, 1, 2000);
                  setTimeout(() => { stat.textContent = '1M+'; }, 2000);
                } else if (text.includes('+')) {
                  const value = parseInt(text);
                  animateValue(stat, 0, value, 2000);
                } else if (text !== '∞') {
                  const value = parseInt(text);
                  stat.textContent = '0';
                  animateValue(stat, 0, value, 2000);
                }
              });
              observer.disconnect();
            }
          });
        });

        const statsSection = document.querySelector('.stats-section');
        if (statsSection) {
          observer.observe(statsSection);
        }

        // === Physics Ball ===
        const canvas = document.getElementById('physics-canvas');
        const ctx = canvas.getContext('2d');
        const wrap = document.querySelector('.wrap');

        const defaultSpeed = 1.2;
        const initAngle = Math.random() * Math.PI * 2;
        const ball = {
          x: 0, y: 0,
          vx: Math.cos(initAngle) * defaultSpeed,
          vy: Math.sin(initAngle) * defaultSpeed,
          radius: 8,
          color: '#e73c7e'
        };

        let obstacleRects = [];
        let obstacleCircles = [];

        function cacheObstacleRects() {
          const wrapRect = wrap.getBoundingClientRect();
          obstacleRects = [];
          obstacleCircles = [];

          function addRect(r) {
            const w = r.right - r.left;
            const h = r.bottom - r.top;
            if (w > 2 && h > 2) {
              obstacleRects.push({
                left: r.left - wrapRect.left,
                top: r.top - wrapRect.top,
                right: r.right - wrapRect.left,
                bottom: r.bottom - wrapRect.top
              });
            }
          }

          function getTextRects(el) {
            // Use Range API to get tight bounds around actual text content
            const range = document.createRange();
            range.selectNodeContents(el);
            const rangeRect = range.getBoundingClientRect();

            // If Range rect is valid and narrower than element, use it
            // (tighter horizontal fit around text)
            const elRect = el.getBoundingClientRect();
            if (rangeRect.width > 5 && rangeRect.height > 5) {
              // Use Range width but element vertical position
              // (Range can misplace y for display:block spans)
              addRect({
                left: rangeRect.left,
                top: elRect.top,
                right: rangeRect.right,
                bottom: elRect.bottom
              });
            } else {
              addRect(elRect);
            }
          }

          function addBorderRects(el, style, r) {
            const borderTop = parseFloat(style.borderTopWidth) || 0;
            const borderBottom = parseFloat(style.borderBottomWidth) || 0;
            const borderLeft = parseFloat(style.borderLeftWidth) || 0;
            const borderRight = parseFloat(style.borderRightWidth) || 0;
            const thickness = 3; // min collision thickness so ball can't phase through

            if (borderTop > 0) {
              addRect({
                left: r.left, top: r.top,
                right: r.right, bottom: r.top + Math.max(borderTop, thickness)
              });
            }
            if (borderBottom > 0) {
              addRect({
                left: r.left, top: r.bottom - Math.max(borderBottom, thickness),
                right: r.right, bottom: r.bottom
              });
            }
            if (borderLeft > 0) {
              addRect({
                left: r.left, top: r.top,
                right: r.left + Math.max(borderLeft, thickness), bottom: r.bottom
              });
            }
            if (borderRight > 0) {
              addRect({
                left: r.right - Math.max(borderRight, thickness), top: r.top,
                right: r.right, bottom: r.bottom
              });
            }
          }

          function addPseudoElementRects(el, r) {
            // Detect ::after and ::before pseudo-elements (including content: "")
            for (const pseudo of ['::before', '::after']) {
              const ps = getComputedStyle(el, pseudo);
              // content must exist and not be 'none' — empty string "" is valid
              if (!ps.content || ps.content === 'none') continue;

              const pw = parseFloat(ps.width) || 0;
              const ph = parseFloat(ps.height) || 0;
              if (pw < 1 && ph < 1) continue;

              const thickness = 3;
              // Compute position from the pseudo-element's offset properties
              const bottomOffset = parseFloat(ps.bottom) || 0;
              // Centered via translateX(-50%) + left: 50% is a common pattern
              const pLeft = r.left + (r.right - r.left - pw) / 2;
              const pTop = r.bottom + Math.abs(bottomOffset);

              addRect({
                left: pLeft,
                top: pTop,
                right: pLeft + pw,
                bottom: pTop + Math.max(ph, thickness)
              });
            }
          }

          function addRects(el) {
            if (el.id === 'physics-canvas') return;

            const style = getComputedStyle(el);
            if (style.display === 'none' || style.visibility === 'hidden') return;

            const r = el.getBoundingClientRect();
            if ((r.right - r.left) === 0 || (r.bottom - r.top) === 0) return;

            const isInsidePortrait = el.closest('.portrait');

            // Circular element (portrait spinner) — use circle collision
            if (el.classList.contains('spinner')) {
              const cx = (r.left + r.right) / 2 - wrapRect.left;
              const cy = (r.top + r.bottom) / 2 - wrapRect.top;
              const radius = Math.min(r.right - r.left, r.bottom - r.top) / 2;
              if (radius > 5) {
                obstacleCircles.push({ cx, cy, radius });
              }
              // Don't recurse into portrait children — spinner covers it
              return;
            }
            // Skip .img inside portrait (covered by spinner circle)
            if (el.classList.contains('img') && el.parentElement && el.parentElement.closest('.portrait')) {
              return;
            }

            // Skip borders/pseudos for elements inside portrait (circle handles it)
            if (!isInsidePortrait) {
              addBorderRects(el, style, r);
              addPseudoElementRects(el, r);
            }

            // Elements with background images or replaced content
            const tag = el.tagName.toLowerCase();
            const hasBgImage = style.backgroundImage !== 'none';
            if (tag === 'img' || tag === 'svg' || tag === 'i' || hasBgImage) {
              if (!isInsidePortrait) addRect(r);
              return;
            }

            // Leaf elements (no child elements) — use tight text rects
            if (el.children.length === 0) {
              if (el.textContent.trim()) {
                getTextRects(el);
              }
              return;
            }

            // Container elements — recurse into children
            for (const child of el.children) {
              addRects(child);
            }
          }

          for (const child of wrap.children) {
            if (child.id !== 'physics-canvas') {
              addRects(child);
            }
          }
        }

        function resizeCanvas() {
          canvas.width = wrap.offsetWidth;
          canvas.height = wrap.offsetHeight;
          cacheObstacleRects();
        }

        function drawBall() {
          // Glow effect
          ctx.shadowColor = ball.color;
          ctx.shadowBlur = 25;

          // Radial gradient for energy orb look
          const gradient = ctx.createRadialGradient(
            ball.x, ball.y, 0,
            ball.x, ball.y, ball.radius
          );
          gradient.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
          gradient.addColorStop(0.3, ball.color);
          gradient.addColorStop(1, 'rgba(231, 60, 126, 0.0)');

          ctx.beginPath();
          ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
          ctx.fillStyle = gradient;
          ctx.fill();

          // Reset shadow for next frame
          ctx.shadowBlur = 0;
        }

        // Initialize
        resizeCanvas();
        ball.x = canvas.width / 2;
        ball.y = canvas.height / 2;

        function animate() {
          // Clear canvas (transparent so content shows through)
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          // Decay speed back toward default after nudge
          const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
          if (speed > defaultSpeed) {
            const decay = 0.995;
            ball.vx *= decay;
            ball.vy *= decay;
          } else if (speed < defaultSpeed && speed > 0) {
            const scale = defaultSpeed / speed;
            ball.vx *= 1 + (scale - 1) * 0.01;
            ball.vy *= 1 + (scale - 1) * 0.01;
          }

          // Move ball
          ball.x += ball.vx;
          ball.y += ball.vy;

          // Wall collision (card boundaries)
          if (ball.x - ball.radius <= 0) {
            ball.x = ball.radius;
            ball.vx = Math.abs(ball.vx);
          } else if (ball.x + ball.radius >= canvas.width) {
            ball.x = canvas.width - ball.radius;
            ball.vx = -Math.abs(ball.vx);
          }

          if (ball.y - ball.radius <= 0) {
            ball.y = ball.radius;
            ball.vy = Math.abs(ball.vy);
          } else if (ball.y + ball.radius >= canvas.height) {
            ball.y = canvas.height - ball.radius;
            ball.vy = -Math.abs(ball.vy);
          }

          // Skip element collisions at high velocity (ball phases through)
          // Stay in phase mode until ball is clear of all obstacles
          const currentSpeed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
          const phaseThreshold = defaultSpeed * 3.125;

          if (currentSpeed >= phaseThreshold) {
            ball.phasing = true;
          } else if (ball.phasing) {
            // Check if ball is clear of all obstacles before re-enabling collisions
            let intersecting = false;
            for (const circle of obstacleCircles) {
              const dx = ball.x - circle.cx;
              const dy = ball.y - circle.cy;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < ball.radius + circle.radius) { intersecting = true; break; }
            }
            if (!intersecting) {
              for (const rect of obstacleRects) {
                const closestX = Math.max(rect.left, Math.min(ball.x, rect.right));
                const closestY = Math.max(rect.top, Math.min(ball.y, rect.bottom));
                const dx = ball.x - closestX;
                const dy = ball.y - closestY;
                if (Math.sqrt(dx * dx + dy * dy) < ball.radius) { intersecting = true; break; }
              }
            }
            if (!intersecting) ball.phasing = false;
          }

          // Circle obstacle collision (portrait)
          if (!ball.phasing)
          for (const circle of obstacleCircles) {
            const dx = ball.x - circle.cx;
            const dy = ball.y - circle.cy;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const minDist = ball.radius + circle.radius;

            if (dist < minDist && dist > 0) {
              // Push ball out along the collision normal
              const nx = dx / dist;
              const ny = dy / dist;
              ball.x = circle.cx + nx * minDist;
              ball.y = circle.cy + ny * minDist;

              // Reflect velocity along the normal
              const dot = ball.vx * nx + ball.vy * ny;
              ball.vx -= 2 * dot * nx;
              ball.vy -= 2 * dot * ny;
            }
          }

          // Obstacle collision (AABB)
          if (!ball.phasing)
          for (const rect of obstacleRects) {
            // Find closest point on rect to ball center
            const closestX = Math.max(rect.left, Math.min(ball.x, rect.right));
            const closestY = Math.max(rect.top, Math.min(ball.y, rect.bottom));
            const dx = ball.x - closestX;
            const dy = ball.y - closestY;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < ball.radius && dist > 0) {
              // Determine which axis to reflect
              const overlapX = ball.radius - Math.abs(dx);
              const overlapY = ball.radius - Math.abs(dy);

              if (overlapX < overlapY) {
                ball.vx = dx > 0 ? Math.abs(ball.vx) : -Math.abs(ball.vx);
                ball.x += dx > 0 ? overlapX : -overlapX;
              } else {
                ball.vy = dy > 0 ? Math.abs(ball.vy) : -Math.abs(ball.vy);
                ball.y += dy > 0 ? overlapY : -overlapY;
              }
            }
          }

          // DEBUG: draw obstacle bounding boxes and circles
          ctx.strokeStyle = 'rgba(231, 60, 126, 0.4)';
          ctx.lineWidth = 1;
          ctx.setLineDash([4, 4]);
          for (const rect of obstacleRects) {
            ctx.strokeRect(rect.left, rect.top, rect.right - rect.left, rect.bottom - rect.top);
          }
          for (const circle of obstacleCircles) {
            ctx.beginPath();
            ctx.arc(circle.cx, circle.cy, circle.radius, 0, Math.PI * 2);
            ctx.stroke();
          }
          ctx.setLineDash([]);

          drawBall();
          requestAnimationFrame(animate);
        }

        animate();

        // Periodically recache rects to handle animations and dynamic content
        // (count-up animation: 2s, fadeInUp: 1s, rotating quotes: every 5s)
        let recacheInterval = setInterval(cacheObstacleRects, 500);
        setTimeout(() => {
          clearInterval(recacheInterval);
          // After animations settle, recache less frequently (for rotating quotes)
          setInterval(cacheObstacleRects, 5000);
        }, 3000);

        let resizeTimeout;
        window.addEventListener('resize', function() {
          clearTimeout(resizeTimeout);
          resizeTimeout = setTimeout(resizeCanvas, 150);
        });

        // Click/tap to nudge
        function nudgeBall(clientX, clientY) {
          const wrapRect = wrap.getBoundingClientRect();
          const x = clientX - wrapRect.left;
          const y = clientY - wrapRect.top;
          const dx = x - ball.x;
          const dy = y - ball.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < ball.radius * 5 && dist > 0) {
            // Repel: launch away from click point, stronger when closer
            const repelX = (ball.x - x) / dist;
            const repelY = (ball.y - y) / dist;
            const force = 3 + (1 - Math.min(dist / (ball.radius * 5), 1)) * 4;
            ball.vx = repelX * force;
            ball.vy = repelY * force;
          }
        }

        wrap.addEventListener('click', function(e) {
          nudgeBall(e.clientX, e.clientY);
        });

        wrap.addEventListener('touchstart', function(e) {
          const touch = e.touches[0];
          nudgeBall(touch.clientX, touch.clientY);
        }, { passive: true });
      });
    </script>
{{ end }}
